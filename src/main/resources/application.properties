server.port=${SERVER_PORT:3333}
# ==================== Microsoft SQL Server ====================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=hacaton;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:StrongPass_123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ==================== Disable schema auto-init ====================
spring.sql.init.mode=never

# ==================== JPA / Hibernate (existing entities, NO schema changes) ====================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ==================== JSON ====================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

# ==================== Limit для больших JSON ====================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB

# ==================== C++ TCP Server ====================
cpp.server.host=${CPP_SERVER_HOST:192.168.7.14}
cpp.server.port=${CPP_SERVER_PORT:2222}

# ==================== Logging (Log4j2) ====================
# Уровни логирования настроены в log4j2.xml
logging.config=classpath:log4j2.xml

# ==================== Временные резервы кабинетов ====================
# Поиск ставит резерв, чтобы кабинет не достался двоим одновременно.
# Если пользователь не подтвердил бронь за это время — резерв снимается.
booking.hold-timeout-minutes=${HOLD_TIMEOUT_MINUTES:10}
booking.hold-cleanup-interval-ms=${HOLD_CLEANUP_INTERVAL_MS:60000}
