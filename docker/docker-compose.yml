# Локальная БД для Schedule Server и C++ CameraServer.
#
#   docker compose -f docker/docker-compose.yml up -d
#   ./docker/init-db.sh
#
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aicam-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng_SA_Passw0rd!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
